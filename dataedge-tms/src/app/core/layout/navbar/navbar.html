<nav class="de-navbar">
  <!-- Brand -->
  <a class="de-navbar__brand" routerLink="/">
    <div class="de-navbar__logo-mark">
      <span>DE</span>
    </div>
    <div class="de-navbar__brand-text">
      <span class="de-navbar__brand-name">DataEdge</span>
      <span class="de-navbar__brand-sub">Treasury Management</span>
    </div>
  </a>

  <!-- Hamburger (mobile only) -->
  <button class="de-navbar__hamburger" (click)="toggleSidebar()" title="Menu">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <!-- Module label -->
  <div class="de-navbar__module-badge">
    <span class="de-badge de-badge--teal">TMS v1.0</span>
  </div>

  <!-- Spacer -->
  <div style="flex:1"></div>

  <!-- Actions -->
  <div class="de-navbar__actions">
    <!-- Notifications -->
    <button class="de-navbar__icon-btn" title="Notifications">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      @if (notificationCount > 0) {
        <span class="de-navbar__badge">{{ notificationCount }}</span>
      }
    </button>

    <!-- Divider -->
    <div class="de-navbar__divider"></div>

    <!-- User menu -->
    <button class="de-navbar__user-btn" (click)="toggleUserMenu()">
      <div class="de-navbar__avatar">{{ currentUser.initials }}</div>
      <div class="de-navbar__user-info">
        <span class="de-navbar__user-name">{{ currentUser.name }}</span>
        <span class="de-navbar__user-role">{{ currentUser.role }}</span>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="de-navbar__chevron">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>

    @if (showUserMenu) {
      <div class="de-navbar__user-dropdown">
        <a class="de-navbar__dd-item" routerLink="/profile">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          My Profile
        </a>
        <a class="de-navbar__dd-item" routerLink="/settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </a>
        <div class="de-navbar__dd-divider"></div>
        <button class="de-navbar__dd-item de-navbar__dd-item--danger">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
    }
  </div>
</nav>
