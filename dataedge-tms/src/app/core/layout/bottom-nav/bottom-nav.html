<nav class="de-bottom-nav">

  <!-- Home -->
  <a class="de-bottom-nav__item" routerLink="/dashboard"
     routerLinkActive="de-bottom-nav__item--active"
     [routerLinkActiveOptions]="{ exact: false }">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    <span>Home</span>
  </a>

  <!-- Blotter -->
  <a class="de-bottom-nav__item" routerLink="/blotter"
     routerLinkActive="de-bottom-nav__item--active"
     [routerLinkActiveOptions]="{ exact: false }">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="12" y2="18"/>
    </svg>
    <span>Blotter</span>
  </a>

  <!-- New Deal (CTA) -->
  <a class="de-bottom-nav__item de-bottom-nav__item--cta" routerLink="/mm-deal/create/basics">
    <div class="de-bottom-nav__cta-ring">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </div>
    <span>New Deal</span>
  </a>

  <!-- Auth Inbox (with badge) -->
  <a class="de-bottom-nav__item" routerLink="/auth-inbox"
     routerLinkActive="de-bottom-nav__item--active"
     [routerLinkActiveOptions]="{ exact: false }">
    <div class="de-bottom-nav__icon-wrap">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
        <rect x="9" y="3" width="6" height="4" rx="1"/>
        <path d="M9 14l2 2 4-4"/>
      </svg>
      @if (pendingCount > 0) {
        <span class="de-bottom-nav__badge">{{ pendingCount }}</span>
      }
    </div>
    <span>Inbox</span>
  </a>

  <!-- Setup -->
  <a class="de-bottom-nav__item" routerLink="/instruments"
     routerLinkActive="de-bottom-nav__item--active"
     [routerLinkActiveOptions]="{ exact: false }">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
    <span>Setup</span>
  </a>

</nav>
